<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termómetros Objetivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Pensado para TV en vertical (1080x1920). La Raspberry gira la imagen; la página ve un viewport vertical. */
  :root {
    color-scheme: dark;
    /* Identidad Gelt Solutions */
    --bg: #0F2235;
    --text-primary: #ffffff;
    --text-secondary: #D6D6D6;
    --text-muted: #8FA7B5;
    --cyan: #1AB8C4;
    --brand-red: #FF344C;
    --good: #92D050;
    --warning: #FFC000;
    --critical: #FF344C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text-primary); font-family: Inter, system-ui, sans-serif;
         overflow: hidden; cursor: none; -webkit-font-smoothing: antialiased; font-size: 1vh; }
  .app { height: 100vh; display: flex; flex-direction: column; padding: 3vh 3vw 2vh; gap: 2vh; }
  header { display: flex; align-items: baseline; gap: 2vw; }
  header .title { font-size: 3.4em; font-weight: 700; }
  header .spacer { flex: 1; }
  header .clock { font-size: 3.4em; font-weight: 600; font-variant-numeric: tabular-nums; }
  .status { font-size: 1.4em; color: var(--text-muted); white-space: nowrap; }
  .stale { color: var(--warning); }
  .demo-badge { white-space: nowrap; font-size: 1.3em; font-weight: 700; color: #000; background: var(--warning); padding: .2em .6em; border-radius: .3em; align-self: center; }
  .dots { display: flex; gap: .8vw; align-self: center; }
  .dots span { width: 1vh; height: 1vh; border-radius: 50%; background: #2e2e2b; }
  .dots span.on { background: #fff; }

  .groups { position: relative; flex: 1; min-height: 0; }
  .group { position: absolute; inset: 0; display: flex; justify-content: space-evenly; gap: 2vw;
           opacity: 0; transition: opacity .8s; }
  .group.on { opacity: 1; }
  .thermo { flex: 1; max-width: 46vw; display: flex; flex-direction: column; align-items: center; gap: 1vh; min-width: 0; }
  .thermo .name { font-size: 3em; font-weight: 700; text-align: center; line-height: 1.1; min-height: 2.2em; display: flex; align-items: flex-end; }
  .group.n3 .thermo .name { font-size: 2.05em; min-height: 3.3em; letter-spacing: 0; }
  .thermo .period { font-size: 1.6em; color: var(--text-secondary); text-align: center; min-height: 2.6em; }
  .thermo svg { flex: 1; min-height: 0; width: 100%; overflow: visible; }
  .thermo .foot { font-size: 2em; font-weight: 600; text-align: center; white-space: nowrap; }
  .thermo .foot .st { display: block; font-size: .8em; margin-top: .3em; }
  .group.n1 .thermo .name { font-size: 4.2em; }
  .group.n1 .thermo .foot { font-size: 2.8em; }

  svg text { font-family: Inter, system-ui, sans-serif; }
  .fill { transition: y 1.6s cubic-bezier(.2,.8,.2,1), height 1.6s cubic-bezier(.2,.8,.2,1); }

  .alert { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
           gap: 3vh; background: rgba(8,8,8,.92); z-index: 10; text-align: center; padding: 4vw; }
  .alert.on { display: flex; animation: flash .35s ease-out 3; }
  .alert .big { font-size: 12em; font-weight: 900; color: #e02b2b; letter-spacing: -.02em; }
  .alert .small { font-size: 4em; font-weight: 600; color: var(--text-secondary); }
  @keyframes flash { 0% { background: rgba(224,43,43,.6); } 100% { background: rgba(8,8,8,.92); } }
  .empty { margin: auto; font-size: 2.4em; color: var(--text-secondary); text-align: center; line-height: 1.5; }

  body { font-family: Lato, system-ui, sans-serif; background: radial-gradient(140vw 90vh at 50% -10%, #0B3552 0%, #0F2235 45%, #0A1826 100%); }
  svg text, .thermo .name, header .title, header .clock, .alert .big, .thermo .foot { font-family: Montserrat, sans-serif; }
  header { align-items: center; }
  header .logo { height: 7vh; }
  header .title { text-transform: uppercase; letter-spacing: .06em; font-weight: 800; font-size: 2.6em; }
  header .status { font-size: 1.15em; }
  header .demo-badge { font-size: 1.1em; }
  .thermo { position: relative; padding: 2vh 1vw 2vh; border-radius: 2vh;
            background: linear-gradient(180deg, rgba(6,59,93,.6), rgba(6,59,93,.22)); border: 1px solid rgba(26,184,196,.16); }
  .thermo::before, .thermo::after { content: ""; position: absolute; width: 3vh; height: 3vh; }
  .thermo::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); border-top-left-radius: 2vh; }
  .thermo::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--brand-red); border-right: 2px solid var(--brand-red); border-bottom-right-radius: 2vh; }
  .thermo .name { text-transform: uppercase; letter-spacing: .04em; font-weight: 800; }
  .thermo .period { color: var(--text-muted); }
  .dots span.on { background: var(--cyan); box-shadow: 0 0 .8vh var(--cyan); }
  .demo-badge { color: #0F2235; }
  .alert { background: rgba(15,34,53,.94); }
  .alert .big { color: var(--brand-red); text-shadow: 0 0 .3em rgba(255,52,76,.6); }
  @keyframes flash { 0% { background: rgba(255,52,76,.55); } 100% { background: rgba(15,34,53,.94); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .75; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  .group.cms-group { padding: 0; }
  .group.cms-group .cms-stage { height: 100%; }
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="assets/gelt-logo.png" alt="Gelt Solutions">
    <div class="title">Objetivos</div>
    <span class="demo-badge" id="demo" hidden>DATOS DE EJEMPLO</span>
    <div class="spacer"></div>
    <div class="dots" id="dots"></div>
    <div class="status" id="status">Cargando…</div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <main class="groups" id="groups"><div class="empty">Cargando…</div></main>
</div>
<div class="alert" id="alert"><div class="big">GOAL!</div><div class="small" id="alertSmall"></div></div>

<script src="cms.js"></script>
<script>
// ===================== CONFIGURACIÓN =====================
const CONFIG = {
  csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHRNDDgG_8_D2IXqbMNs-lrYgoJpeDZJLCSjCm1zI7fvXcvqEg0HMN-WcbtRtb-1w9gHKd7D77foHM/pub?gid=940809333&single=true&output=csv",
  refreshMin: 5,
  groupSec: 20,     // segundos por grupo si hay más de 3 termómetros
  perScreen: 3,
  sound: true,
  officeDays: [1, 2, 3, 4, 5], officeFrom: 9, officeTo: 19
};
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");
if (params.has("n")) CONFIG.perScreen = Math.max(1, Math.min(4, +params.get("n")));

// Colores del relleno (columna "Color" del Sheet)
const COLORS = { rojo: "#FF344C", cian: "#1AB8C4", azul: "#1AB8C4", verde: "#92D050", amarillo: "#FFC000", naranja: "#FF8A3D", morado: "#9B6BFF", rosa: "#FF5FA2" };

// ===================== UTILIDADES =====================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.map(r => r.map(c => c.trim()));
}
function num(s) {
  if (s == null) return null;
  const t = String(s).replace(/[€%\s]/g, "").replace(/\./g, "").replace(",", ".");
  return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : null;
}
// "29/09", "29/09/2026" -> Date (año actual si no viene)
function date(s) {
  const m = String(s || "").match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (!m) return null;
  let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000;
  return new Date(y, +m[2] - 1, +m[1]);
}
const nf0 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 1 });
function fmt(v, unit) {
  const a = Math.abs(v);
  const n = a >= 1e6 ? nf1.format(v / 1e6) + "M" : a >= 1e4 ? nf1.format(v / 1e3) + "k" : nf0.format(v);
  return unit ? (unit === "€" ? n + " €" : n + " " + unit) : n;
}
const fmtFull = (v, unit) => nf0.format(v) + (unit ? (unit === "€" ? " €" : " " + unit) : "");
const short = (v, unit) => Math.abs(v) >= 1e5 ? fmt(v, unit) : fmtFull(v, unit);
const dm = d => d.toLocaleDateString("es-ES", { day: "numeric", month: "short" }).replace(".", "");

// ===================== DATOS =====================
// Bloque en la pestaña Display:
//   [termometro] Objetivos
//   Nombre,Objetivo,Actual,Unidad,Inicio,Fin,Color
//   Venta semanal,120.000,78.400,€,29/09,03/10,rojo
//   (fila vacía = fin del bloque)
function thermometers(rows) {
  const out = [];
  for (let i = 0; i < rows.length; i++) {
    if (!/^\[term/i.test(rows[i][0] || "")) continue;
    const head = (rows[++i] || []).map(c => c.toLowerCase());
    const col = n => head.findIndex(c => c.startsWith(n));
    const C = { name: col("nombre"), obj: col("objetivo"), act: col("actual"), unit: col("unidad"), from: col("inicio"), to: col("fin"), color: col("color") };
    for (i++; i < rows.length; i++) {
      const r = rows[i];
      if (r.every(c => !c) || /^\[/.test(r[0] || "")) { i--; break; }
      const obj = num(r[C.obj]), act = num(r[C.act]);
      if (!r[C.name] || !obj) continue;
      out.push({ name: r[C.name], obj, act: act || 0, unit: C.unit >= 0 ? r[C.unit] : "",
                 from: C.from >= 0 ? date(r[C.from]) : null, to: C.to >= 0 ? date(r[C.to]) : null,
                 color: COLORS[(r[C.color] || "").toLowerCase()] || (/^#[0-9a-f]{6}$/i.test(r[C.color] || "") ? r[C.color] : COLORS.rojo) });
    }
  }
  return out;
}
function paceOf(t) {
  if (!t.from || !t.to) return null;
  const end = new Date(t.to); end.setDate(end.getDate() + 1); // el día "Fin" cuenta entero
  return Math.max(0, Math.min(100, (Date.now() - t.from) / (end - t.from) * 100));
}
function daysLeft(t) {
  if (!t.to) return null;
  const end = new Date(t.to); end.setHours(23, 59, 59);
  return Math.max(0, Math.ceil((end - Date.now()) / 864e5));
}

// ===================== TERMÓMETRO (SVG) =====================
// Geometría en un lienzo 300x1300: tablero claro, banner arriba, tubo con escala 0-100 %, bulbo abajo.
function thermoSVG(t, idx) {
  const p = t.act / t.obj * 100, shown = Math.min(100, Math.max(0, p));
  const Y0 = 1010, Y100 = 250;                      // y del 0 % y del 100 %
  const y = v => Y0 - (Y0 - Y100) * v / 100;
  const pace = paceOf(t), done = p >= 100, c = t.color, id = "t" + idx;
  let ticks = "";
  for (let v = 10; v <= 100; v += 10) {
    const yy = y(v), major = v % 20 === 0 || v === 100;
    ticks += `<line x1="200" x2="${major ? 232 : 220}" y1="${yy}" y2="${yy}" stroke="${v <= shown ? c : "#3B6478"}" stroke-width="${major ? 4 : 3}" stroke-linecap="round"/>`;
    if (major) ticks += `<text x="242" y="${yy + 9}" font-size="26" font-weight="700" style="fill:${v === 100 ? "#FF344C" : v <= shown ? "#fff" : "#8FA7B5"}">${v}%</text>`;
  }
  for (let v = 5; v < 100; v += 10) ticks += `<line x1="200" x2="212" y1="${y(v)}" y2="${y(v)}" stroke="#1E4E6E" stroke-width="2"/>`;
  const paceMark = pace == null ? "" : `
    <path d="M62,${y(pace) - 14} L90,${y(pace)} L62,${y(pace) + 14} Z" fill="#fff" filter="url(#${id}g)"/>
    <text x="56" y="${y(pace) + 8}" text-anchor="end" font-size="21" font-weight="700" style="fill:#fff">RITMO</text>`;
  // burbujas que suben por el líquido
  const top = y(shown) + 30;
  const bubbles = shown > 4 ? [0, 1, 2, 3, 4, 5].map(k => {
    const bx = 120 + (k * 23) % 60, r = 4 + (k % 3) * 2.5, dur = 3.5 + (k % 4) * 1.1, delay = k * .7;
    return `<circle cx="${bx}" cy="1090" r="${r}" fill="#fff" opacity=".35">
      <animate attributeName="cy" values="1090;${top}" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".45;.25;0" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/></circle>`;
  }).join("") : "";
  const objTxt = fmt(t.obj, t.unit), actTxt = fmt(t.act, t.unit);
  return `
  <svg viewBox="0 0 300 1320" preserveAspectRatio="xMidYMid meet" aria-label="${esc(t.name)} ${nf0.format(p)}%">
    <defs>
      <filter id="${id}g" x="-80%" y="-20%" width="260%" height="140%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="${id}f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c}" stop-opacity=".75"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".7"/></linearGradient>
      <radialGradient id="${id}b" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".85"/></radialGradient>
      <clipPath id="${id}c"><rect x="113" y="${y(shown)}" width="74" height="${1110 - y(shown)}" class="fill" data-y="${y(shown)}"/></clipPath>
    </defs>
    <!-- banner objetivo -->
    <rect x="30" y="20" width="240" height="${done ? 130 : 150}" rx="22" fill="#FF344C" filter="url(#${id}g)" class="${done ? "pulse" : ""}"/>
    ${done
      ? `<text x="150" y="108" text-anchor="middle" font-size="64" font-weight="900" style="fill:#fff" letter-spacing="2">GOAL!</text>`
      : `<text x="150" y="66" text-anchor="middle" font-size="22" font-weight="700" style="fill:#fff" letter-spacing="4">OBJETIVO</text>
         <text x="150" y="126" text-anchor="middle" font-size="${objTxt.length > 8 ? 40 : 50}" font-weight="900" style="fill:#fff">${esc(objTxt)}</text>`}
    ${ticks}
    ${paceMark}
    <!-- tubo de vidrio -->
    <rect x="104" y="200" width="92" height="900" rx="46" fill="rgba(255,255,255,.04)" stroke="rgba(26,184,196,.55)" stroke-width="3"/>
    <!-- líquido -->
    <rect class="fill" x="113" y="${y(shown)}" width="74" height="${1110 - y(shown)}" rx="37" fill="url(#${id}f)" filter="url(#${id}g)" data-y="${y(shown)}"/>
    <g clip-path="url(#${id}c)">${bubbles}</g>
    <rect x="122" y="220" width="14" height="840" rx="7" fill="#fff" opacity=".12"/>
    <!-- bulbo -->
    <circle cx="150" cy="1178" r="128" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="2 9" opacity=".8"/>
    <circle cx="150" cy="1178" r="108" fill="url(#${id}b)" filter="url(#${id}g)"/>
    <text x="150" y="1172" text-anchor="middle" font-size="${actTxt.length > 8 ? 34 : 42}" font-weight="900" style="fill:#fff">${esc(actTxt)}</text>
    <text x="150" y="1222" text-anchor="middle" font-size="40" font-weight="800" style="fill:#fff;opacity:.9">${nf0.format(p)}%</text>
  </svg>`;
}

function statusOf(t) {
  const p = t.act / t.obj * 100, pace = paceOf(t);
  if (p >= 100) return ["var(--good)", "✓ Conseguido"];
  if (pace == null) return ["var(--text-secondary)", ""];
  if (p >= pace) return ["var(--good)", "▲ En ritmo"];
  if (p >= pace * .8) return ["var(--warning)", "● Algo por detrás"];
  return ["var(--critical)", "▼ Por detrás"];
}

function thermoCard(t, idx) {
  const left = daysLeft(t), st = statusOf(t), falta = t.obj - t.act;
  const period = t.from && t.to ? `${dm(t.from)} – ${dm(t.to)}${left != null ? ` · ${left === 0 ? "último día" : left === 1 ? "queda 1 día" : "quedan " + left + " días"}` : ""}` : "";
  return `<div class="thermo">
    <div class="name">${esc(t.name)}</div>
    <div class="period">${period}</div>
    ${thermoSVG(t, idx)}
    <div class="foot">${falta > 0 ? `Faltan ${esc(short(falta, t.unit))}` : falta < 0 ? `Superado en ${esc(short(-falta, t.unit))}` : `¡Objetivo cumplido!`}
      ${st[1] ? `<span class="st" style="color:${st[0]}">${st[1]}</span>` : ""}</div>
  </div>`;
}

// ===================== AVISOS =====================
let actx;
const audio = () => actx || (actx = new (window.AudioContext || window.webkitAudioContext)());
function quiet() { const d = new Date(), h = d.getHours(); return !CONFIG.officeDays.includes(d.getDay()) || h < CONFIG.officeFrom || h >= CONFIG.officeTo; }
function gunshot(at = 0) {
  const a = audio(), t = a.currentTime + at;
  const len = a.sampleRate * .6, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  const src = a.createBufferSource(); src.buffer = buf;
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(6000, t); lp.frequency.exponentialRampToValueAtTime(400, t + .4);
  const g = a.createGain(); g.gain.setValueAtTime(1.4, t); g.gain.exponentialRampToValueAtTime(.001, t + .6);
  src.connect(lp).connect(g).connect(a.destination); src.start(t);
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .25);
  og.gain.setValueAtTime(1.2, t); og.gain.exponentialRampToValueAtTime(.001, t + .3);
  o.connect(og).connect(a.destination); o.start(t); o.stop(t + .35);
}
function fanfare(at = 0) {
  const a = audio(), t0 = a.currentTime + at;
  [[523, 0], [659, .15], [784, .3], [1047, .45]].forEach(([f, dt], i) => {
    const o = a.createOscillator(), g = a.createGain(); o.type = "triangle"; o.frequency.value = f;
    const t = t0 + dt, dur = i === 3 ? 1.2 : .18;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.5, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  });
}
function celebrate(t) {
  $("alertSmall").textContent = `${t.name} · ${fmtFull(t.act, t.unit)}`;
  const el = $("alert"); el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  if (CONFIG.sound && !quiet()) try { gunshot(0); gunshot(.35); gunshot(.7); fanfare(1.2); } catch (e) {}
  setTimeout(() => el.classList.remove("on"), 9000);
}
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("thermo_" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("thermo_" + k, JSON.stringify(v)); } catch {} }
};
function checkGoals(list) {
  if (DEMO) return;
  const done = store.get("done") || {};
  for (const t of list) {
    const key = t.name + "|" + (t.from ? t.from.toISOString().slice(0, 10) : "") + "|" + t.obj;
    if (t.act >= t.obj && !done[key]) { done[key] = Date.now(); celebrate(t); break; }
  }
  store.set("done", done);
}
window.testGoal = () => celebrate({ name: "Venta semanal", act: 120000, unit: "€" });

// ===================== DEMO =====================
function demoCSV() {
  const d = new Date(), mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  const f = x => `${x.getDate()}/${x.getMonth() + 1}`;
  return `
[termometro] Objetivos
Nombre,Objetivo,Actual,Unidad,Inicio,Fin,Color
Venta semanal,120.000,78.400,€,${f(mon)},${f(fri)},rojo
Deals cerrados semana,10,6,deals,${f(mon)},${f(fri)},azul
Facturación Q4,1.500.000,259.128,€,1/10,31/12,verde
Reuniones nuevas,25,25,reuniones,${f(mon)},${f(fri)},naranja
`;
}

// ===================== CICLO =====================
let groups = [], cur = 0, lastOk = 0, rotStart = Date.now();
let lastList = null, cmsSlides = [], cmsThermos = [], lastText = "", pending = null, videoEnded = false;
const PREVIEW = params.has("preview");   // vista previa del gestor: los datos llegan por postMessage

// Termómetros creados en el gestor -> mismo formato que los del Sheet
function ymd(s) { const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fromCms(list, values) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return (list || []).filter(t => t.active !== false && t.name && +t.obj > 0)
    .filter(t => !t.to || ymd(t.to) >= today)            // al terminar el periodo deja de mostrarse
    .map(t => {
      let act = +t.act || 0;
      if (t.src === "sheet") { const v = (values || []).find(x => CMS.keyOf(x.label) === CMS.keyOf(t.sheetLabel)); act = v ? v.value : 0; }
      return { name: t.name, obj: +t.obj, act, unit: t.unit || "", from: ymd(t.from), to: ymd(t.to),
               color: COLORS[(t.color || "").toLowerCase()] || (/^#[0-9a-f]{6}$/i.test(t.color || "") ? t.color : COLORS.rojo) };
    });
}
const allThermos = () => thermometers(parseCSV(lastText)).concat(fromCms(cmsThermos, CMS.sheetValues(lastText)));

async function load() {
  try {
    const r = await fetch(CONFIG.csvUrl + "&t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    let text = await r.text();
    if (DEMO && !/^\[term/im.test(text)) text += "\n" + demoCSV();
    store.set("csv", text); lastOk = Date.now(); lastText = text;
    render(allThermos(), true);
  } catch (e) {
    const c = store.get("csv"); if (c && !groups.length) { lastText = c; render(allThermos(), false); }
  }
  status();
}
// Pantallas y termómetros del gestor de contenidos
async function loadCms() {
  const [slides, thermos] = await Promise.all([CMS.fetchSlides(), CMS.fetchList("thermos")]);
  if (!slides && !thermos) return;
  const sig = JSON.stringify([slides, thermos]);
  if (sig === loadCms.sig) return;
  loadCms.sig = sig; cmsSlides = slides || []; cmsThermos = thermos || [];
  if (lastList) render(allThermos(), false);
}
function render(list, fresh) {
  lastList = list;
  $("demo").hidden = !DEMO;
  const n = CONFIG.perScreen, chunks = [];
  for (let i = 0; i < list.length; i += n) chunks.push(list.slice(i, i + n));
  const html = chunks.map((c, gi) => `<section class="group n${c.length}">${c.map((t, j) => thermoCard(t, gi * n + j)).join("")}</section>`)
    .concat(CMS.active(cmsSlides, "v").map(sl => `<section class="group cms-group" data-dur="${CMS.waitsForVideo(sl) ? 0 : (+sl.dur || CONFIG.groupSec) * 1000}" ${CMS.waitsForVideo(sl) ? 'data-wait="1"' : ""}><div class="cms-stage">${CMS.render(sl)}</div></section>`))
    .join("");
  if (fresh) checkGoals(list);
  if (!html) {
    $("groups").innerHTML = `<div class="empty">No hay termómetros definidos.<br>Añade un bloque <b>[termometro]</b> en la pestaña Display.</div>`;
    groups = []; $("dots").innerHTML = ""; return;
  }
  if (groups.length > 1) { pending = html; return; }
  apply(html, cur);
}
function apply(html, idx) {
  const main = $("groups");
  const prevY = [...main.querySelectorAll(".fill")].map(el => el.getAttribute("y"));
  groups.forEach(g => CMS.onHide(g));
  main.innerHTML = html;
  groups = [...main.children];
  cur = idx >= groups.length ? 0 : idx;
  groups[cur].classList.add("on");
  CMS.onShow(groups[cur]); bindVideoEnd();
  $("dots").innerHTML = groups.length > 1 ? groups.map((_, i) => `<span class="${i === cur ? "on" : ""}"></span>`).join("") : "";
  animate(main, prevY);
}
function bindVideoEnd() {
  videoEnded = false;
  const v = groups[cur]?.dataset.wait ? groups[cur].querySelector("video[data-cms-video=main]") : null;
  if (v) v.onended = () => { videoEnded = true; };
}
function curDur() {
  const g = groups[cur];
  if (!g) return CONFIG.groupSec * 1000;
  if (g.dataset.wait) return videoEnded ? 0 : 600000;
  return +g.dataset.dur || CONFIG.groupSec * 1000;
}
// El mercurio sube desde el valor anterior (o desde 0 la primera vez)
function animate(root, prevY) {
  if (params.has("noanim")) return;
  root.querySelectorAll(".fill").forEach((el, i) => {
    const to = +el.dataset.y, from = prevY[i] != null ? +prevY[i] : 1010;
    el.setAttribute("y", from); el.setAttribute("height", 1110 - from);
    setTimeout(() => { el.setAttribute("y", to); el.setAttribute("height", 1110 - to); }, 60);
  });
}
function rotate() {
  if (pending != null) { const h = pending; pending = null; apply(h, cur + 1); rotStart = Date.now(); return; }
  if (groups.length < 2) return;
  CMS.onHide(groups[cur]);
  groups[cur].classList.remove("on"); cur = (cur + 1) % groups.length; groups[cur].classList.add("on");
  CMS.onShow(groups[cur]); bindVideoEnd();
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === cur));
  animate(groups[cur], []);
  rotStart = Date.now();
}
function status() {
  const s = $("status");
  if (!lastOk) { s.innerHTML = `<span class="stale">Sin conexión con el Sheet</span>`; return; }
  const min = Math.round((Date.now() - lastOk) / 60000);
  // En vertical no sobra ancho: solo se muestra si los datos están desfasados
  s.innerHTML = min > CONFIG.refreshMin * 3 ? `<span class="stale">Datos de hace ${min} min</span>` : "";
}
function tick() {
  $("clock").textContent = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  if (Date.now() - rotStart >= curDur()) rotate();
}
if (PREVIEW) {
  // El gestor manda {thermos, values}: se pinta sin rotar, sin sonido y sin avisos
  CONFIG.groupSec = 1e9; CONFIG.sound = false; $("status").textContent = "";
  window.addEventListener("message", e => {
    if (!e.data || !e.data.thermos) return;
    const list = fromCms(e.data.thermos, e.data.values);
    pending = null; groups = []; render(list, false);
    if (!list.length) $("groups").innerHTML = `<div class="empty">Rellena nombre y objetivo para ver el termómetro.</div>`;
  });
  setInterval(tick, 500);
  parent.postMessage({ thermoPreviewReady: true }, "*");
} else {
  loadCms().then(load);
  CMS.listenSales({ sound: false });   // la ráfaga suena solo por la horizontal
  setInterval(load, CONFIG.refreshMin * 60000);
  setInterval(loadCms, 60000);
  setInterval(tick, 500);
  setInterval(status, 30000);
}
setInterval(() => { const d = new Date(); if (d.getHours() === 4 && d.getMinutes() === 0) location.reload(); }, 60000);
</script>
